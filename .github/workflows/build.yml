name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyinstaller hidapi "pywebview>=4.0"

      - name: Build exe
        run: |
          pyinstaller --onefile --windowed `
            --add-data "ui;ui" `
            --icon "icon.ico" `
            --hidden-import "webview.platforms.edgechromium" `
            --name aula_driver `
            main.py

      - name: Get commit message
        id: commit
        run: echo "msg=$(git log -1 --pretty=%s)" >> $env:GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.commit.outputs.msg }}
          files: dist/aula_driver.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}